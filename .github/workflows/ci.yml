name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: gofmt -l . | tee /dev/stderr | (! read)
        name: gofmt
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
